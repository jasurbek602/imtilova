name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bog'liqliklarni o'rnatish (SDK ga mos versiyalar)
        run: |
          npm install
          npx expo install expo@~54.0.0
          npx expo install \
            expo-audio expo-haptics expo-linear-gradient expo-location \
            expo-notifications expo-status-bar \
            @react-native-async-storage/async-storage \
            react-native-screens react-native-safe-area-context \
            react-native @expo/vector-icons
          npx expo install --fix

      - name: Diagnostika (versiyalar)
        continue-on-error: true
        run: |
          npm ls expo expo-modules-autolinking expo-modules-core || true
          npx expo-doctor || true

      - name: Native Android loyihasini yaratish (prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Diagnostika (versiyasiz modullar)
        continue-on-error: true
        run: |
          npx expo-modules-autolinking resolve --platform android --json | node -e "
          const j=JSON.parse(require('fs').readFileSync(0,'utf8'));
          for(const m of j.modules||[]) for(const p of m.projects||[])
            if(!p.publication||!p.publication.version) console.log('VERSIONSIZ:', m.packageName, m.packageVersion);
          " || true

      - uses: gradle/actions/setup-gradle@v4

      - name: APK yig'ish (faqat arm64 — Samsung S22 uchun)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: islom-yoli-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
